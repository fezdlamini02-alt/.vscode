<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Photographic interior-backed illustration (local photo fallback)</title>

  <!-- Background image: place ST10506754/images/photos/interior.jpg in the repo for this to display locally -->
  <image href="photos/interior.jpg" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice" />

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bfe6ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Semi-transparent overlay to ensure legibility of foreground vector elements -->
  <rect width="1200" height="800" fill="#ffffff" opacity="0.12" />

  <!-- Foreground vector accents (keeps the original illustrative feel on top of the photo) -->
  <!-- Window frame highlight -->
  <g filter="url(#softShadow)">
    <rect x="760" y="110" width="280" height="380" rx="8" ry="8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" />
    <path d="M792 150 C900 170 980 150 995 200" fill="none" stroke="url(#glass)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.35"/>
  </g>

  <!-- Subtle vignette -->
  <rect width="1200" height="800" fill="black" opacity="0.06" />

  <!-- Accessibility: title + description -->
  <desc>This SVG uses a local photographic background (photos/interior.jpg) when present; otherwise it provides a stylized overlay and decorations.</desc>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Stylized salmon illustration</title>
  <defs>
    <linearGradient id="salmonBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a7b"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="salmonAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd3c2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb0a0" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#e8f8ff" />

  <!-- Sea shadow -->
  <ellipse cx="450" cy="480" rx="320" ry="60" fill="#cbeefc" opacity="0.5" />

  <!-- Salmon body -->
  <g transform="translate(200,200)" filter="url(#drop)">
    <path d="M180 60 C240 40 360 40 430 80 C470 100 470 170 420 200 C360 230 240 230 180 200 C140 180 120 120 180 60 Z" fill="url(#salmonBody)" />
    <!-- belly -->
    <path d="M190 130 C260 110 360 110 410 140 C400 170 340 190 260 190 C220 180 200 150 190 130 Z" fill="url(#salmonAccent)" opacity="0.95" />
    <!-- fins -->
    <path d="M225 50 C200 30 170 30 150 50 C180 60 210 70 225 50 Z" fill="#ff8f77" opacity="0.95" />
    <path d="M420 160 C460 150 490 170 520 190 C490 180 460 170 420 160 Z" fill="#ff8f77" opacity="0.95" />
    <!-- eye -->
    <circle cx="320" cy="90" r="8" fill="#2b2b2b" />
    <circle cx="326" cy="86" r="2" fill="#fff" />
    <!-- scales accent -->
    <g fill="#ffffff" opacity="0.14">
      <ellipse cx="260" cy="100" rx="8" ry="5" />
      <ellipse cx="290" cy="115" rx="8" ry="5" />
      <ellipse cx="320" cy="125" rx="8" ry="5" />
      <ellipse cx="355" cy="135" rx="8" ry="5" />
    </g>
  </g>

  <!-- decorative water lines -->
  <g stroke="#bfeafc" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <path d="M50 420 C200 360 400 500 850 430" fill="none"/>
    <path d="M70 460 C220 400 420 540 830 460" fill="none"/>
  </g>

  <image href="salmon.jpg" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice" aria-label="Realistic grilled salmon" />
</svg>

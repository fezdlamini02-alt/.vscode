<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="plateFinish" cx="48%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="32%" stop-color="#faf6f0"/>
      <stop offset="68%" stop-color="#f2ebe2"/>
      <stop offset="100%" stop-color="#d9cbb5"/>
    </radialGradient>
    <linearGradient id="salmonCooked" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8856"/>
      <stop offset="18%" stop-color="#f77a48"/>
      <stop offset="38%" stop-color="#e66938"/>
      <stop offset="62%" stop-color="#d45028"/>
      <stop offset="80%" stop-color="#b83f1f"/>
      <stop offset="100%" stop-color="#8a2f15"/>
    </linearGradient>
    <linearGradient id="asparagusRealistic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a7c2a"/>
      <stop offset="50%" stop-color="#3d5a1f"/>
      <stop offset="100%" stop-color="#2a4014"/>
    </linearGradient>
    <filter id="foodDepth">
      <feDropShadow dx="0" dy="20" stdDeviation="14" flood-opacity="0.48" flood-color="#1a1410"/>
    </filter>
  </defs>

  <!-- Professional food photography background -->
  <rect width="1200" height="800" fill="#faf6f0"/>

  <!-- Plate shadow -->
  <ellipse cx="600" cy="525" rx="365" ry="140" fill="#3a2a1a" opacity="0.30"/>
  <ellipse cx="600" cy="520" rx="345" ry="115" fill="#5a4a3a" opacity="0.14"/>

  <!-- Premium ceramic plate -->
  <circle cx="600" cy="380" r="315" fill="#fffef9" stroke="#e5d7c3" stroke-width="6"/>
  <circle cx="600" cy="380" r="308" fill="url(#plateFinish)"/>
  <circle cx="600" cy="380" r="315" fill="none" stroke="#f0e8dc" stroke-width="14" opacity="0.35"/>

  <!-- Grilled salmon fillet - restaurant quality -->
  <g filter="url(#foodDepth)">
    <!-- Main salmon flesh -->
    <path d="M340 410c5-95 110-170 240-180 130-10 228 55 245 155 17 100-45 170-155 180-110 10-300-40-330-155z" 
          fill="url(#salmonCooked)" stroke="#7a3a2a" stroke-width="5" opacity="0.97"/>
    
    <!-- Cooked salmon surface -->
    <ellipse cx="600" cy="355" rx="210" ry="70" fill="rgba(255, 140, 86, 0.45)" opacity="0.65"/>
    
    <!-- Realistic grill marks -->
    <g stroke="#8a3a2a" stroke-width="3.5" opacity="0.42" stroke-linecap="round">
      <path d="M410 360L630 435"/>
      <path d="M420 348L640 425"/>
      <path d="M400 385L620 455"/>
      <path d="M390 410L610 480"/>
      <path d="M410 450L630 520"/>
    </g>
    
    <!-- Salmon muscle tones -->
    <path d="M460 375Q570 345 710 390Q680 435 570 455Q490 440 460 375Z" fill="#d85a38" opacity="0.35"/>
    <path d="M490 420Q600 405 730 460Q710 495 600 510Q520 485 490 420Z" fill="#c44a28" opacity="0.28"/>
    
    <!-- Salmon skin edge -->
    <path d="M365 430c65-25 195-38 260-15 35 12 45 28 38 42-7 14-38 10-70 2" 
          fill="none" stroke="#a8442a" stroke-width="2.5" opacity="0.35"/>
  </g>

  <!-- Fresh asparagus spears -->
  <g filter="url(#foodDepth)">
    <!-- Left bundle -->
    <path d="M330 490Q325 560 318 630" stroke="url(#asparagusRealistic)" stroke-width="13" stroke-linecap="round"/>
    <path d="M330 490Q325 560 318 630" stroke="#6a9a3a" stroke-width="10" opacity="0.85" stroke-linecap="round"/>
    <path d="M330 490Q325 560 318 630" stroke="#7aaa4a" stroke-width="7" opacity="0.55" stroke-linecap="round"/>
    
    <path d="M375 500Q372 565 365 640" stroke="url(#asparagusRealistic)" stroke-width="12" stroke-linecap="round"/>
    <path d="M375 500Q372 565 365 640" stroke="#6a9a3a" stroke-width="9" opacity="0.85" stroke-linecap="round"/>
    
    <path d="M420 495Q418 560 415 630" stroke="url(#asparagusRealistic)" stroke-width="11" stroke-linecap="round"/>
    <path d="M420 495Q418 560 415 630" stroke="#6a9a3a" stroke-width="8" opacity="0.85" stroke-linecap="round"/>
    
    <!-- Right bundle -->
    <path d="M820 480Q835 550 850 620" stroke="url(#asparagusRealistic)" stroke-width="13" stroke-linecap="round"/>
    <path d="M820 480Q835 550 850 620" stroke="#6a9a3a" stroke-width="10" opacity="0.85" stroke-linecap="round"/>
    <path d="M820 480Q835 550 850 620" stroke="#7aaa4a" stroke-width="7" opacity="0.55" stroke-linecap="round"/>
    
    <path d="M865 495Q882 560 900 635" stroke="url(#asparagusRealistic)" stroke-width="12" stroke-linecap="round"/>
    <path d="M865 495Q882 560 900 635" stroke="#6a9a3a" stroke-width="9" opacity="0.85" stroke-linecap="round"/>
  </g>

  <!-- Fresh lemon garnish -->
  <g filter="url(#foodDepth)">
    <circle cx="480" cy="335" r="32" fill="#ffed4e"/>
    <circle cx="480" cy="335" r="29" fill="#fef97f"/>
    <circle cx="480" cy="335" r="27" fill="#fff5a0" opacity="0.75"/>
    <g stroke="#f4d000" stroke-width="1.8" opacity="0.65">
      <line x1="480" y1="303" x2="480" y2="367"/>
      <line x1="448" y1="335" x2="512" y2="335"/>
      <line x1="458" y1="313" x2="502" y2="357"/>
      <line x1="502" y1="313" x2="458" y2="357"/>
    </g>
    
    <circle cx="750" cy="320" r="30" fill="#ffed4e"/>
    <circle cx="750" cy="320" r="27" fill="#fef97f"/>
    <circle cx="750" cy="320" r="25" fill="#fff5a0" opacity="0.75"/>
    <g stroke="#f4d000" stroke-width="1.8" opacity="0.65">
      <line x1="750" y1="290" x2="750" y2="350"/>
      <line x1="720" y1="320" x2="780" y2="320"/>
    </g>
  </g>

  <!-- Microgreens/herbs - fine dining detail -->
  <g filter="url(#foodDepth)">
    <path d="M610 310c12-28 25-20 35 6 10 26 2 48-12 50-14 2-32-14-36-32-4-22 8-34 13-24" 
          fill="#2d5a1a" opacity="0.88"/>
    <path d="M660 350c9-22 20-18 28 3 8 21 0 40-10 41-10 1-26-12-28-28-2-18 5-26 10-16" 
          fill="#2d5a1a" opacity="0.83"/>
  </g>

  <!-- Sauce accent -->
  <g filter="url(#foodDepth)">
    <path d="M760 500c18-10 28-6 33 8" fill="none" stroke="#c44a28" stroke-width="3.5" opacity="0.32" stroke-linecap="round"/>
  </g>

  <!-- Plate surface reflection -->
  <ellipse cx="600" cy="365" rx="290" ry="85" fill="rgba(255, 255, 255, 0.14)" opacity="0.5"/>

  <!-- Fine atmospheric overlay -->
  <rect width="1200" height="800" fill="rgba(0, 0, 0, 0.05)"/>
</svg>
